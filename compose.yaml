name: logistpulse
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logist_demo}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-logist}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [logist]

  mongo:
    image: mongo:8.0
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [logist]

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [logist]

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092"]
    networks: [logist]

  inventory-api:
    build: ./services/inventory-api
    environment:
      INVENTORY_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:-logist_demo}@postgres:5432/inventory_db
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 15}
    networks: [logist]

  logistics-api:
    build: ./services/logistics-api
    environment:
      LOGISTICS_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:-logist_demo}@postgres:5432/logistics_db
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 15}
    networks: [logist]

  operations-api:
    build: ./services/operations-api
    environment:
      MONGO_URI: mongodb://mongo:27017
      MQTT_HOST: mosquitto
    depends_on: {mongo: {condition: service_healthy}, mosquitto: {condition: service_started}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 15}
    networks: [logist]

  telemetry-simulator:
    build: ./services/telemetry-simulator
    environment: {MQTT_HOST: mosquitto}
    depends_on: [mosquitto]
    networks: [logist]

  fulfillment-api:
    build: ./services/fulfillment-api
    environment:
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:-logist_demo}@postgres:5432/fulfillment_db
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on: {postgres: {condition: service_healthy}, redpanda: {condition: service_started}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 15}
    networks: [logist]

  fulfillment-worker:
    build: ./services/fulfillment-worker
    environment:
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:-logist_demo}@postgres:5432/fulfillment_db
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on: {postgres: {condition: service_healthy}, redpanda: {condition: service_started}}
    networks: [logist]

  console:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    depends_on: [inventory-api,logistics-api,operations-api,fulfillment-api]
    networks: [logist]

networks:
  logist: {name: logistpulse-net}
volumes:
  pg_data:
  mongo_data:
