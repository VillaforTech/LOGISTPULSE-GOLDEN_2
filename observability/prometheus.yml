global:
  scrape_interval: 5s
scrape_configs:
  - job_name: inventory-api
    metrics_path: /metrics
    static_configs: [{targets: ['inventory-api:8000']}]
  - job_name: logistics-api
    metrics_path: /metrics
    static_configs: [{targets: ['logistics-api:8000']}]
  - job_name: operations-api
    metrics_path: /metrics
    static_configs: [{targets: ['operations-api:8000']}]
  - job_name: fulfillment-api
    metrics_path: /metrics
    static_configs: [{targets: ['fulfillment-api:8000']}]
  - job_name: cadvisor
    static_configs: [{targets: ['cadvisor:8080']}]
