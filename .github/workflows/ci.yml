name: LOGISTPULSE CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate required platform assets
        run: |
          test -f compose.yaml
          test -f .devcontainer/Dockerfile
          test -f observability/compose.yaml
          test -f observability/prometheus.yml
          for s in inventory-api logistics-api operations-api fulfillment-api; do test -f services/$s/app.py; done
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f observability/compose.yaml config --quiet
          ANALYTICS_COVERAGE_FROM=2026-09-16T00:00:00Z docker compose -f compose.yaml -f compose.analytics.yaml config --quiet
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Infrastructure regression tests
        run: python3 -m unittest discover -s tests/infrastructure -v
      - name: Fulfillment domain and worker regression tests
        run: |
          pip install -r services/fulfillment-worker/requirements.txt
          python -m pytest services/fulfillment-api/tests services/fulfillment-worker/tests -q
      - name: Compile Python services
        run: python3 -m compileall -q services scripts
      - name: Test analytics when its component is included
        run: |
          if test -f services/business-analytics/requirements-test.txt; then
            cd services/business-analytics
            pip install -r requirements-test.txt
            python -m pytest tests -q
          else
            echo 'Analytics not included in this foundation branch; full acceptance remains pending.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: '**/surefire-reports/*'
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: architecture-contract
    steps:
      - uses: actions/checkout@v4
      - name: Build and start LOGISTPULSE
        run: |
          bash scripts/up.sh
          coverage_from=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          printf 'ANALYTICS_COVERAGE_FROM=%s\n' "$coverage_from" >> "$GITHUB_ENV"
          ANALYTICS_COVERAGE_FROM="$coverage_from" docker compose -f compose.yaml -f compose.analytics.yaml up -d --build --wait --wait-timeout 120 business-analytics
      - name: Wait and smoke test
        run: |
          python3 scripts/wait-ready.py
          bash scripts/smoke.sh
          bash scripts/business-test.sh
      - name: Verify real producer to analytics and restart recovery
        run: python3 services/business-analytics/tests/system_integration.py --output artifacts/analytics/producer-integration.json
      - name: Start observability control plane
        run: docker compose -f observability/compose.yaml up -d prometheus grafana
      - name: Validate observability health
        run: |
          for i in $(seq 1 30); do if curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1; then break; fi; sleep 2; done
          curl -fsS http://localhost:9090/-/ready
          for i in $(seq 1 30); do if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then break; fi; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q ok
      - name: Execute integrated team acceptance when supplied
        run: |
          if test -d scripts/acceptance; then
            bash scripts/team-acceptance.sh
          else
            echo 'FOUNDATION VERIFIED ONLY: domain, Live and acceptance contributions are not integrated.'
          fi
      - name: Save run identity and runtime evidence before teardown
        if: always()
        run: |
          mkdir -p artifacts/runtime
          git rev-parse HEAD > artifacts/runtime/tested-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/runtime/run-id.txt
          docker compose -f compose.yaml -f compose.analytics.yaml ps --all > artifacts/runtime/containers.txt
          docker compose -f compose.yaml -f compose.analytics.yaml logs --no-color --tail=250 > artifacts/runtime/platform.log 2>&1
          docker compose -f observability/compose.yaml logs --no-color --tail=100 > artifacts/runtime/observability.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: artifacts/
          if-no-files-found: error
      - name: Stop observability
        if: always()
        run: docker compose -f observability/compose.yaml down || true
      - name: Container status on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.analytics.yaml ps && docker compose -f compose.yaml -f compose.analytics.yaml logs --tail=250
      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml -f compose.analytics.yaml down -v

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [architecture-contract, unit, integration]
    if: ${{ always() }}
    steps:
      - name: Require every CI stage to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-contract.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          printf 'Architecture: %s\nIntegration: %s\n' "$ARCHITECTURE_RESULT" "$INTEGRATION_RESULT"
          if [[ "$UNIT_RESULT" != "success" || "$ARCHITECTURE_RESULT" != "success" || "$INTEGRATION_RESULT" != "success" ]]; then
            echo "::error::Release blocked: every required stage must succeed; skipped or cancelled stages do not pass."
            exit 1
          fi
